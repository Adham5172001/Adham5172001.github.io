<svg viewBox="0 0 1012 242" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t22618"><title id="t22618">MEA spike detection pipeline</title><desc>Six-stage pipeline from raw multi-electrode array recording through filtering, feature extraction, ANNIGMA feature selection and a genetic-algorithm-weighted fuzzy rule base to a spike classification accompanied by the rules that fired.</desc><g transform="translate(16,16)"><text x="0" y="20" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" letter-spacing="1.6" fill="#8f8f8a">DETECTION PIPELINE</text><rect x="0" y="62" width="142" height="86" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="71.0" y="90.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Raw MEA</text><text x="71.0" y="107.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">recording</text><text x="71.0" y="128.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">60 electrodes</text><line x1="142" y1="105.0" x2="160" y2="105.0" stroke="#8f8f8a" stroke-width="1.2"/><path d="M160 101.0 L167 105.0 L160 109.0" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="167" y="62" width="142" height="86" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="238.0" y="98.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Bandpass filter</text><text x="238.0" y="119.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">noise floor</text><line x1="309" y1="105.0" x2="327" y2="105.0" stroke="#8f8f8a" stroke-width="1.2"/><path d="M327 101.0 L334 105.0 L327 109.0" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="334" y="62" width="142" height="86" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="405.0" y="82.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Windowed</text><text x="405.0" y="99.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">features</text><text x="405.0" y="120.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">amplitude · slope ·</text><text x="405.0" y="135.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">shape</text><line x1="476" y1="105.0" x2="494" y2="105.0" stroke="#8f8f8a" stroke-width="1.2"/><path d="M494 101.0 L501 105.0 L494 109.0" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="501" y="62" width="142" height="86" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="572.0" y="90.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#ccf24d">ANNIGMA</text><text x="572.0" y="107.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#ccf24d">selection</text><text x="572.0" y="128.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">gain ranking</text><line x1="643" y1="105.0" x2="661" y2="105.0" stroke="#8f8f8a" stroke-width="1.2"/><path d="M661 101.0 L668 105.0 L661 109.0" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="668" y="62" width="142" height="86" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="739.0" y="98.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#ccf24d">Fuzzy rule base</text><text x="739.0" y="119.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">IF-THEN, GA weights</text><line x1="810" y1="105.0" x2="828" y2="105.0" stroke="#8f8f8a" stroke-width="1.2"/><path d="M828 101.0 L835 105.0 L828 109.0" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="835" y="62" width="142" height="86" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="906.0" y="98.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Spike / no spike</text><text x="906.0" y="119.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">+ fired rule trace</text><path d="M501 162 L501 178 L977 178 L977 162" fill="none" stroke="#ccf24d" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/><text x="739.0" y="196" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#ccf24d">every decision traces back to named electrodes and firing patterns</text></g></svg>