<svg viewBox="0 0 1012 352" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t75284"><title id="t75284">Retrieval-augmented generation architecture</title><desc>An engineer query is embedded and matched against a FAISS index built from chunked engineering documentation; retrieved context is assembled into a constrained prompt so the model answers only from supplied sources, returning a cited answer or an explicit abstention.</desc><g transform="translate(16,16)"><text x="0" y="20" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" letter-spacing="1.6" fill="#8f8f8a">RETRIEVAL-AUGMENTED DIAGNOSIS</text><rect x="0" y="58" width="160" height="80" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="80.0" y="91.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Engineer query</text><text x="80.0" y="112.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">natural language</text><rect x="196" y="58" width="160" height="80" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="276.0" y="91.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Embedding</text><text x="276.0" y="112.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">vector encode</text><rect x="392" y="58" width="160" height="80" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="472.0" y="91.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#ccf24d">FAISS retrieval</text><text x="472.0" y="112.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">tuned for recall</text><rect x="588" y="58" width="160" height="80" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="668.0" y="91.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Context assembly</text><text x="668.0" y="112.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">top-k chunks</text><rect x="784" y="58" width="196" height="80" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="882.0" y="91.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#ccf24d">Grounded generation</text><text x="882.0" y="112.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">context-only prompt</text><line x1="160" y1="98.0" x2="189" y2="98.0" stroke="#8f8f8a" stroke-width="1.2"/><path d="M189 94.0 L196 98.0 L189 102.0" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="356" y1="98.0" x2="385" y2="98.0" stroke="#8f8f8a" stroke-width="1.2"/><path d="M385 94.0 L392 98.0 L385 102.0" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="552" y1="98.0" x2="581" y2="98.0" stroke="#8f8f8a" stroke-width="1.2"/><path d="M581 94.0 L588 98.0 L581 102.0" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="748" y1="98.0" x2="777" y2="98.0" stroke="#8f8f8a" stroke-width="1.2"/><path d="M777 94.0 L784 98.0 L777 102.0" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="392" y="208" width="160" height="74" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="472.0" y="238.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Chunked docs</text><text x="472.0" y="259.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">procedure-preserving</text><line x1="472" y1="208" x2="472" y2="145" stroke="#8f8f8a" stroke-width="1.2"/><path d="M468 145 L472 138 L476 145" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="784" y="208" width="196" height="74" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="882.0" y="238.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#ccf24d">Cited answer</text><text x="882.0" y="259.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">or explicit abstention</text><line x1="882" y1="138" x2="882" y2="201" stroke="#ccf24d" stroke-width="1.2"/><path d="M878 201 L882 208 L886 201" fill="none" stroke="#ccf24d" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="260" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">Retrieval carries the knowledge.</text><text x="0" y="278" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">The model only carries the language.</text></g></svg>