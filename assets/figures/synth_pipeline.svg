<svg viewBox="0 0 1012 432" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t18701"><title id="t18701">Synthetic data generation pipeline</title><desc>Fifty real telecom images feed three generative models — DCGAN, Beta-VAE and Stable Diffusion — producing over 350,000 synthetic images, evaluated both on FID and Inception Score and on downstream YOLOv8 detection performance.</desc><g transform="translate(16,16)"><text x="0" y="20" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" letter-spacing="1.6" fill="#6e6e6b">GENERATIVE AUGMENTATION PIPELINE</text><rect x="0" y="52" width="168" height="78" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="84.0" y="85.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#ccf24d">50 real images</text><text x="84.0" y="104.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">10 fault classes</text><rect x="268" y="46" width="190" height="62" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="363.0" y="71.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">DCGAN</text><text x="363.0" y="90.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">texture, surface detail</text><path d="M168 91 C 215 91, 225 77.0, 261 77.0" fill="none" stroke="#6e6e6b" stroke-width="1.2"/><path d="M261 73.0 L268 77.0 L261 81.0" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="268" y="128" width="190" height="62" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="363.0" y="153.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Beta-VAE</text><text x="363.0" y="172.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">disentangled latent</text><path d="M168 91 C 215 91, 225 159.0, 261 159.0" fill="none" stroke="#6e6e6b" stroke-width="1.2"/><path d="M261 155.0 L268 159.0 L261 163.0" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="268" y="210" width="190" height="62" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="363.0" y="235.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Stable Diffusion</text><text x="363.0" y="254.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">novel compositions</text><path d="M168 91 C 215 91, 225 241.0, 261 241.0" fill="none" stroke="#6e6e6b" stroke-width="1.2"/><path d="M261 237.0 L268 241.0 L261 245.0" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="488" y="46" width="172" height="226" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="574.0" y="145.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#ccf24d">350,000+ synthetic</text><text x="574.0" y="160.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#ccf24d">images</text><text x="574.0" y="179.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">mixed at a tuned ratio</text><line x1="458" y1="77.0" x2="481" y2="77.0" stroke="#6e6e6b" stroke-width="1.2"/><path d="M481 73.0 L488 77.0 L481 81.0" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="458" y1="159.0" x2="481" y2="159.0" stroke="#6e6e6b" stroke-width="1.2"/><path d="M481 155.0 L488 159.0 L481 163.0" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="458" y1="241.0" x2="481" y2="241.0" stroke="#6e6e6b" stroke-width="1.2"/><path d="M481 237.0 L488 241.0 L481 245.0" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="690" y="46" width="168" height="74" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="774.0" y="77.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">FID / Inception</text><text x="774.0" y="96.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">generation quality</text><rect x="690" y="146" width="168" height="74" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="774.0" y="177.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Downstream mAP</text><text x="774.0" y="196.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">ablation — decisive</text><line x1="660" y1="83" x2="683" y2="83" stroke="#6e6e6b" stroke-width="1.2"/><path d="M683 79 L690 83 L683 87" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="660" y1="183" x2="683" y2="183" stroke="#6e6e6b" stroke-width="1.2"/><path d="M683 179 L690 183 L683 187" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="690" y="246" width="168" height="74" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="774.0" y="277.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#ccf24d">YOLOv8 detector</text><text x="774.0" y="296.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">mAP@0.5 → 0.943</text><line x1="774" y1="220" x2="774" y2="239" stroke="#6e6e6b" stroke-width="1.2"/><path d="M770 239 L774 246 L778 239" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="352" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">Quality metrics are a sanity check. The ablation against real detection performance is what decided the mix.</text></g></svg>