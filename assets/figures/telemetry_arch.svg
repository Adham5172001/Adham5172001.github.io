<svg viewBox="0 0 1012 362" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t53847"><title id="t53847">Motorsport streaming telemetry architecture</title><desc>Thirteen telemetry channels per lap flow through Kafka into feature computation and three parallel models — anomaly detection, lap-time prediction and tyre degradation — surfacing to the race engineer, with the whole inference path containerised for race-weekend reliability.</desc><g transform="translate(16,16)"><text x="0" y="20" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" letter-spacing="1.6" fill="#6e6e6b">STREAMING TELEMETRY ARCHITECTURE</text><rect x="0" y="108" width="158" height="92" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="79.0" y="148.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#ccf24d">Car on track</text><text x="79.0" y="167.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">13 channels / lap</text><rect x="206" y="108" width="150" height="92" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="281.0" y="148.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#ccf24d">Kafka</text><text x="281.0" y="167.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">buffers, decouples</text><line x1="158" y1="154" x2="199" y2="154" stroke="#6e6e6b" stroke-width="1.2"/><path d="M199 150 L206 154 L199 158" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="406" y="108" width="156" height="92" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="484.0" y="148.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Feature computation</text><text x="484.0" y="167.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">rolling windows</text><line x1="356" y1="154" x2="399" y2="154" stroke="#6e6e6b" stroke-width="1.2"/><path d="M399 150 L406 154 L399 158" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="612" y="54" width="178" height="66" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="701.0" y="81.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Anomaly detection</text><text x="701.0" y="100.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">sensitivity-weighted</text><path d="M562 154 C 588 154, 592 87.0, 605 87.0" fill="none" stroke="#6e6e6b" stroke-width="1.2"/><path d="M605 83.0 L612 87.0 L605 91.0" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="612" y="132" width="178" height="66" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="701.0" y="159.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Lap-time prediction</text><text x="701.0" y="178.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">in-progress lap</text><path d="M562 154 C 588 154, 592 165.0, 605 165.0" fill="none" stroke="#6e6e6b" stroke-width="1.2"/><path d="M605 161.0 L612 165.0 L605 169.0" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="612" y="210" width="178" height="66" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="701.0" y="237.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Tyre degradation</text><text x="701.0" y="256.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">stint decay</text><path d="M562 154 C 588 154, 592 243.0, 605 243.0" fill="none" stroke="#6e6e6b" stroke-width="1.2"/><path d="M605 239.0 L612 243.0 L605 247.0" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="818" y="108" width="162" height="92" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="899.0" y="148.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#ccf24d">Race engineer</text><text x="899.0" y="167.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">decision in time</text><path d="M790 87.0 C 792 87.0, 796 154, 811 154" fill="none" stroke="#6e6e6b" stroke-width="1.2"/><path d="M790 165.0 C 792 165.0, 796 154, 811 154" fill="none" stroke="#6e6e6b" stroke-width="1.2"/><path d="M790 243.0 C 792 243.0, 796 154, 811 154" fill="none" stroke="#6e6e6b" stroke-width="1.2"/><path d="M811 150 L818 154 L811 158" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="196" y="34" width="604" height="264" rx="12" fill="none" stroke="#ccf24d" stroke-width="1" stroke-dasharray="3 5" opacity=".4"/><text x="206" y="320" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#ccf24d">Docker + Kubernetes — identical environments, automatic restart, independent deployability</text></g></svg>