<svg viewBox="0 0 1012 362" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t84457"><title id="t84457">Explainability method triangulation</title><desc>Five explainability methods each answer a different question about a living neural biocomputer; agreement across methods is treated as evidence, whereas a signal from a single method is treated only as a lead.</desc><g transform="translate(16,16)"><text x="0" y="20" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" letter-spacing="1.6" fill="#8f8f8a">FIVE METHODS, FOUR QUESTIONS</text><text x="89.0" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" letter-spacing="1.4" fill="#ccf24d">WHERE</text><rect x="0" y="92" width="178" height="96" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="89.0" y="126.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">ANNIGMA</text><text x="89.0" y="147.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">which electrodes carry</text><text x="89.0" y="162.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">gain</text><line x1="89.0" y1="188" x2="89.0" y2="242" stroke="#8f8f8a" stroke-width="1" stroke-dasharray="3 4"/><text x="289.0" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" letter-spacing="1.4" fill="#ccf24d">WHERE</text><rect x="200" y="92" width="178" height="96" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="289.0" y="126.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Permutation</text><text x="289.0" y="147.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">which electrodes the</text><text x="289.0" y="162.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">model needs</text><line x1="289.0" y1="188" x2="289.0" y2="242" stroke="#8f8f8a" stroke-width="1" stroke-dasharray="3 4"/><text x="489.0" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" letter-spacing="1.4" fill="#ccf24d">WHEN</text><rect x="400" y="92" width="178" height="96" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="489.0" y="133.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Fuzzy rules</text><text x="489.0" y="154.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">under what conditions</text><line x1="489.0" y1="188" x2="489.0" y2="242" stroke="#8f8f8a" stroke-width="1" stroke-dasharray="3 4"/><text x="689.0" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" letter-spacing="1.4" fill="#ccf24d">WHAT IF</text><rect x="600" y="92" width="178" height="96" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="689.0" y="126.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Counterfactuals</text><text x="689.0" y="147.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">what would have to</text><text x="689.0" y="162.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">change</text><line x1="689.0" y1="188" x2="689.0" y2="242" stroke="#8f8f8a" stroke-width="1" stroke-dasharray="3 4"/><text x="889.0" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" letter-spacing="1.4" fill="#ccf24d">HOW</text><rect x="800" y="92" width="178" height="96" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="889.0" y="126.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e9e9e6">Moran's I + hubs</text><text x="889.0" y="147.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">how activity is</text><text x="889.0" y="162.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">organised</text><line x1="889.0" y1="188" x2="889.0" y2="242" stroke="#8f8f8a" stroke-width="1" stroke-dasharray="3 4"/><line x1="89" y1="242" x2="891" y2="242" stroke="#8f8f8a" stroke-width="1" stroke-dasharray="3 4"/><line x1="490.0" y1="242" x2="490.0" y2="255" stroke="#8f8f8a" stroke-width="1.2"/><path d="M486.0 255 L490.0 262 L494.0 255" fill="none" stroke="#8f8f8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="290.0" y="262" width="400" height="56" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="490.0" y="283.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#ccf24d">Convergent finding = evidence about the biology</text><text x="490.0" y="304.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8f8f8a">single-method signal = a lead, not a result</text></g></svg>