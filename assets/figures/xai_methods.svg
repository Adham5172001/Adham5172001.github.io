<svg viewBox="0 0 1012 362" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t97193"><title id="t97193">Explainability method triangulation</title><desc>Five explainability methods each answer a different question about a living neural biocomputer; agreement across methods is treated as evidence, whereas a signal from a single method is treated only as a lead.</desc><g transform="translate(16,16)"><text x="0" y="20" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" letter-spacing="1.6" fill="#6e6e6b">FIVE METHODS, FOUR QUESTIONS</text><text x="89.0" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" letter-spacing="1.4" fill="#ccf24d">WHERE</text><rect x="0" y="92" width="178" height="96" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="89.0" y="134.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">ANNIGMA</text><text x="89.0" y="153.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">which electrodes carry gain</text><line x1="89.0" y1="188" x2="89.0" y2="242" stroke="#6e6e6b" stroke-width="1" stroke-dasharray="3 4"/><text x="289.0" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" letter-spacing="1.4" fill="#ccf24d">WHERE</text><rect x="200" y="92" width="178" height="96" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="289.0" y="127.5" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Permutation</text><text x="289.0" y="146.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">which electrodes the model</text><text x="289.0" y="159.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">needs</text><line x1="289.0" y1="188" x2="289.0" y2="242" stroke="#6e6e6b" stroke-width="1" stroke-dasharray="3 4"/><text x="489.0" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" letter-spacing="1.4" fill="#ccf24d">WHEN</text><rect x="400" y="92" width="178" height="96" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="489.0" y="134.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Fuzzy rules</text><text x="489.0" y="153.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">under what conditions</text><line x1="489.0" y1="188" x2="489.0" y2="242" stroke="#6e6e6b" stroke-width="1" stroke-dasharray="3 4"/><text x="689.0" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" letter-spacing="1.4" fill="#ccf24d">WHAT IF</text><rect x="600" y="92" width="178" height="96" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="689.0" y="134.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Counterfactuals</text><text x="689.0" y="153.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">what would have to change</text><line x1="689.0" y1="188" x2="689.0" y2="242" stroke="#6e6e6b" stroke-width="1" stroke-dasharray="3 4"/><text x="889.0" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" letter-spacing="1.4" fill="#ccf24d">HOW</text><rect x="800" y="92" width="178" height="96" rx="9" fill="#17171a" stroke="rgba(255,255,255,.12)" stroke-width="1"/><text x="889.0" y="134.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#e9e9e6">Moran's I + hubs</text><text x="889.0" y="153.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">how activity is organised</text><line x1="889.0" y1="188" x2="889.0" y2="242" stroke="#6e6e6b" stroke-width="1" stroke-dasharray="3 4"/><line x1="89" y1="242" x2="891" y2="242" stroke="#6e6e6b" stroke-width="1" stroke-dasharray="3 4"/><line x1="490.0" y1="242" x2="490.0" y2="255" stroke="#6e6e6b" stroke-width="1.2"/><path d="M486.0 255 L490.0 262 L494.0 255" fill="none" stroke="#6e6e6b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="290.0" y="262" width="400" height="56" rx="9" fill="rgba(204,242,77,.07)" stroke="#ccf24d" stroke-width="1"/><text x="490.0" y="284.0" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="#ccf24d">Convergent finding = evidence about the biology</text><text x="490.0" y="303.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#6e6e6b">single-method signal = a lead, not a result</text></g></svg>